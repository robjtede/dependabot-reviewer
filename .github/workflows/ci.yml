name: CI

on:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  pull_request:
    branches: [main]
    types: [opened, ready_for_review, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        id: rust
        background: true
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          components: clippy

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      - name: Enter Nix devshell
        id: devshell
        background: true
        uses: nicknovitski/nix-develop@v1.2.1
        with:
          arguments: .#ci

      - name: Wait for Rust
        wait: rust

      - name: Install just and cargo-nextest
        uses: taiki-e/install-action@v2.90.3
        with:
          tool: just,cargo-nextest

      - name: Wait for Nix devshell
        wait: devshell

      - name: Run Clippy
        run: just clippy

      - name: Run tests
        run: just test

  zizmor:
    name: GitHub Actions Security
    runs-on: ubuntu-slim

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Scan workflows for security issues
        uses: zizmorcore/zizmor-action@v0.8.1
        with:
          advanced-security: false
          annotations: true
