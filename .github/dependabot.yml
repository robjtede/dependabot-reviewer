version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: lockfile-only
    cooldown:
      default-days: 7
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
