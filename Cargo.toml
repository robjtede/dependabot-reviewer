[package]
name = "dependabot-reviewer"
version = "0.1.0"
description = "Review, rebase, recreate, and merge Dependabot pull requests across GitHub repositories"
authors = ["Rob Ede <robjtede@icloud.com>"]
keywords = ["dependabot", "github", "automation", "cli", "dependencies"]
categories = ["command-line-utilities", "development-tools"]
repository = "https://github.com/robjtede/dependabot-reviewer"
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.88"
readme = "README.md"
include = ["Cargo.lock", "Cargo.toml", "LICENSE-APACHE", "LICENSE-MIT", "README.md", "src/**/*"]

[dependencies]
camino = "1"
clap = { version = "4.5", features = ["derive"] }
console = "0.16"
derive_more = { version = "2", features = ["display"] }
dialoguer = { version = "0.12", features = ["fuzzy-select"] }
dirs = "6"
error-stack = "0.6"
futures-buffered = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
impl-more = "0.3"
octocrab = "0.49"
semver = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
toml = "1"
